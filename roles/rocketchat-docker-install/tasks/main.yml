---
- name: create dirs
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
    recurse: true
  loop:
    - "{{ path }}"

- name: transfer files
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: '{{ item.dest }}'
    mode: '{{ item.mode }}'
  loop: 
    - { src: env.j2, dest: '{{ path }}/.env', mode: '644' }
    - { src: project-compose.yml.j2, dest: '{{ path }}/project-compose.yml', mode: '644' }

- name: run project-compose up
  ansible.builtin.shell: project-compose up --build -d
  args:
    chdir: '{{ path }}'
  ignore_errors: true
  register: output

- ansible.builtin.debug:
    var: output
