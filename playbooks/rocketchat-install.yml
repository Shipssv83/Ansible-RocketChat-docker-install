---
- name: include server install play
  ansible.builtin.import_playbook: server-install.yml

- name: include project install play
  ansible.builtin.import_playbook: project-install.yml
  
- name: rocketchat project install
  become: true
  hosts: '{{ host }}'
  vars:
    fqdn: ecxexample.com
    server_name: "rocket.{{ fqdn }}"
    rocket_root_url: "https://rocket.{{ fqdn }}"

  roles:
  - roles/rocketchat-project-install

  tasks: 

  - name: configure ufw web route
    community.general.system.ufw:
      rule: allow
      port: 3000
      route: true
      proto: tcp
      comment: allow web route
